# Yaqin Gastro Cafe по IP-адресу, пока не работает домен.
# На сервере: /etc/nginx/sites-available/yaqin. Установка — docs/deploy.md.
# Приложение — Docker-контейнер из /opt/yaqin, слушает только 127.0.0.1:3000.
# Сертификат Let's Encrypt на IP (профиль shortlived, живёт 6 дней), продлевает certbot сам.

upstream yaqin_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Проверка Let's Encrypt при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/yaqin-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaqin-ip/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Кабинет принимает до 4 фото по 15 МБ.
    client_max_body_size 64m;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain application/manifest+json;

    location / {
        proxy_pass http://yaqin_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Заменяем, а не дописываем: приложению с TRUST_PROXY=true нельзя подсунуть чужой IP
        # и обойти лимит попыток входа.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
